<!doctype html><meta charset="utf-8"><title>Piano timing verification</title><button id="run">RUN AUDIO CHECKS</button><pre id="results">Ready</pre><script type="module">
import {Piano,releaseSeconds} from '../dist/piano.js?v=8';
import {BeatPlayer} from '../dist/tempo-player.js?v=8';
const out=document.querySelector('#results');
const assert=(value,msg)=>{if(!value)throw Error(msg);};
function make(){const ctx=new OfflineAudioContext(1,44100*6,44100),piano=new Piano(ctx);const buffer=ctx.createBuffer(1,44100*6,44100);buffer.getChannelData(0).fill(.2);piano.buffers.set(60,buffer);return {ctx,piano};}
function rms(buffer,start,end){const data=buffer.getChannelData(0);let s=0,n=0;for(let i=Math.floor(start*44100);i<Math.floor(end*44100);i++){s+=data[i]**2;n++;}return Math.sqrt(s/n);}
document.querySelector('#run').onclick=async()=>{out.textContent='Rendering actual Web Audio envelopes…';const result=[];try{
 for(const bpm of [60,120,240]){const {ctx,piano}=make(),duration=240/bpm;piano.note(60,.1,duration,.7);const b=await ctx.startRendering();assert(rms(b,.1+duration-.04,.1+duration-.01)>.01,'long note cut early '+bpm);assert(rms(b,.1+duration+.15,.1+duration+.2)<.00001,'long tail '+bpm);result.push(`PASS ${bpm} BPM: four beats = ${duration}s, bounded release`);}
 for(const [initial,next] of [[60,240],[240,60]]){const {ctx,piano}=make(),player=new BeatPlayer(piano,[{note:60,beat:0,duration:4,velocity:.7}],4,{bpm:initial,lead:0});player.pump();const paused=ctx.suspend(.5),rendered=ctx.startRendering();await paused;const before=player.beatAt();player.setTempo(next);assert(Math.abs(player.beatAt()-before)<1e-9,'phase changed');const end=player.timeAt(4);await ctx.resume();const b=await rendered;assert(rms(b,end-.04,end-.01)>.01,'retimed note ended early');assert(rms(b,end+.15,end+.2)<.00001,'retimed note ended late');result.push(`PASS live ${initial} → ${next}: held note ends at ${end.toFixed(4)}s, no restart`);}
 {const {ctx,piano}=make();piano.note(60,.1,.0625,.7);const b=await ctx.startRendering();assert(rms(b,.11,.14)>.01,'short attack missing');assert(rms(b,.20,.25)<.00001,'short release too long');result.push('PASS 240 BPM sixteenth note: 62.5ms + 12.5ms release');}
 out.textContent=result.join('\n')+'\nALL AUDIO CHECKS PASSED';
 }catch(e){out.textContent=result.join('\n')+'\nFAIL '+e.stack;}};
</script>
